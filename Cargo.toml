[workspace]
members = [
    ".",
    "crates/phoenix-shared",
    "crates/phoenix-plugin-sdk",
    "examples/plugins/now",
    "examples/plugins/plan",
    "examples/plugins/review",
    "examples/plugins/feature",
    "examples/plugins/ask-user-questions",
]

[package]
name = "phoenix"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A lightweight, fast, minimalistic agent harness"

[[bin]]
name = "phoenix"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "io-std", "fs", "net", "process", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
fs2 = "0.4"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
pin-project-lite = "0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
libc = "0.2"
glob = "0.3"
base64 = "0.22.1"
ratatui-textarea = { version = "0.9", default-features = false, features = ["crossterm"] }
phoenix-shared = { path = "crates/phoenix-shared" }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
assert_cmd = "2"
predicates = "3"
