[package]
name = "phx"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "tmux plugin for spawning isolated coding-agent instances in a monorepo"
repository = "https://github.com/duckedup/phx"

[[bin]]
name = "phx"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
glob = "0.3"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
