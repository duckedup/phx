[package]
name = "phoenix-plugin-sdk"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "SDK for building Phoenix native tool plugins"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
phoenix-shared = { path = "../phoenix-shared" }
